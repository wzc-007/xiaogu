<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据大屏 · 小招 Buddy</title>
<style>
:root{--bg:#f6f7f9;--paper:#fff;--ink:#18243a;--muted:#66758b;--subtle:#8b97a9;--line:#e5e9ef;--blue:#245eea;--gold:#ad8444;--gold-bg:#f8f1e5;--green:#16865d;--red:#d74847;--rail:196px;--radius:8px;--numbers:"Bahnschrift","Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 "Microsoft YaHei","PingFang SC",sans-serif}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button{background:var(--paper);border:1px solid #dbe1e9;border-radius:5px;padding:7px 12px;white-space:nowrap}
button:hover{border-color:#a9bff6;color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{min-width:0;border:1px solid #dbe1e9;background:white;border-radius:5px;padding:7px 9px}
a{color:inherit;text-decoration:none}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--paper);border-right:1px solid var(--line);z-index:3}
.brand{height:57px;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--line);color:var(--gold);white-space:nowrap;font-weight:700;font-size:16px;letter-spacing:.055em}
.brand b{font:700 21px Georgia,serif;letter-spacing:-.055em}
.brand i{display:grid;place-items:center;width:20px;height:20px;background:#9d3d2e;border:1px solid #ccaa6d;border-radius:50%;color:#fff1cf;font:italic bold 15px Georgia,serif}
.rail-label{display:flex;align-items:center;gap:9px;color:var(--gold);font-weight:700;margin:25px 17px 9px;padding:0 5px}
.rail-label span:last-child{margin-left:auto}
.rail-subnav{list-style:none;margin:0;padding:0}
.rail-subnav + .rail-label{margin-top:16px}
.nav-link{display:flex;align-items:center;gap:9px;height:42px;margin:4px 10px;padding:0 12px;border-radius:5px;color:#506079;border-right:2px solid transparent}
@media(min-width:641px){.rail-subnav .nav-link{padding-inline-start:30px;white-space:normal;height:auto;min-height:42px;padding-block:8px}}
.nav-link:hover{background:#f6f8fc}
.nav-link[aria-current=page]{background:var(--gold-bg);color:#946b2d;border-right-color:#c39c5b;font-weight:700}
.shell{margin-left:var(--rail)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 25px;min-height:57px;background:var(--paper);border-bottom:1px solid var(--line);gap:10px}
.crumb{display:flex;align-items:center;gap:10px;color:var(--muted)}
.crumb strong{color:var(--ink)}
.crumb i{font-style:normal;color:#a7b1be}
.demo{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:#c3a06a}
.tabs{display:flex;align-items:stretch;gap:24px;height:39px;padding:0 25px;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs a{display:flex;align-items:center;color:var(--muted);border-bottom:2px solid transparent}
.tabs a[aria-current=page]{color:#976d32;border-color:#bd9556;font-weight:700}
.record-panel{margin-top:14px;border-radius:4px}
.record-filters{padding:15px 12px;border-bottom:1px solid var(--line)}
.record-filters label{display:inline-flex;align-items:center;gap:6px}
.record-filters input{width:170px}
.record-actions{display:flex;gap:8px;margin-left:auto}
.record-query{background:#be8e52;color:white;border-color:#be8e52}
.record-query:hover{background:#a97639;color:white;border-color:#a97639}
.record-table th{background:#f7f7f8}
.record-table td:first-child{white-space:normal;min-width:210px}
.record-table td:nth-child(6){white-space:normal;min-width:125px}
.record-status{display:inline-block;padding:1px 7px;border:1px solid currentColor;border-radius:3px;font-size:12px}
.record-status.ok{color:#16865d;background:#f0fbf5}
.record-status.warn{color:#a86b2b;background:#fff7e9}
.record-status.error{color:#b33b3b;background:#fff2f2}
.record-export{border:0;padding:4px;color:var(--blue);background:transparent}
.record-panel .table-footer{justify-content:flex-end;padding-inline:12px;border-top:1px solid var(--line)}
.record-panel .table-footer button[aria-current=page]{background:#be8e52;color:white;border-color:#be8e52}
main{max-width:1760px;margin:auto;padding:21px 25px 35px}
.page-title{margin:0 0 3px;font-size:23px;letter-spacing:.015em;line-height:1.35}
.page-intro{color:var(--muted);margin:0 0 16px}
.toolbar,.filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.toolbar{margin-bottom:20px;min-height:35px}
.toolbar .push{margin-left:auto}
.segment{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid #dfe4ec;border-radius:6px;background:white}
.segment button{border:0;padding:4px 11px;background:transparent;color:var(--muted);border-radius:4px}
.segment button[aria-pressed=true]{color:white;background:var(--blue)}
.date-range{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.date-range input{padding:5px 7px}
.date-range[hidden]{display:none}
.section{margin-top:22px}
.section h2{margin:0 0 2px;font-size:16px;line-height:1.5}
.section-head{margin-bottom:9px;display:flex;align-items:end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-head p{margin:0;font-size:12px;color:var(--muted)}
.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.card{padding:12px 13px}
.stat{min-height:83px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.stat-label{display:flex;align-items:center;gap:6px;color:#4b5c76;font-size:12px}
.icon{width:20px;height:20px;flex:0 0 20px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--accent),white 90%);color:var(--accent);border-radius:4px;font:bold 13px var(--numbers)}
.stat-value{font:600 26px/1.1 var(--numbers);font-variant-numeric:tabular-nums;letter-spacing:-.035em;white-space:nowrap}
.unit{font:11px "Microsoft YaHei",sans-serif;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat-foot{display:flex;align-items:baseline;justify-content:space-between;gap:4px;flex-wrap:wrap}
.delta{font:11px var(--numbers);white-space:nowrap}
.up{color:var(--red)}.down{color:var(--green)}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:7px;color:var(--accent);font:12px var(--numbers)}
.bar{flex:1;height:5px;background:#eef1f5;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.module h3{display:flex;align-items:center;gap:7px;margin:0 0 7px;font-size:13px}
.module dl{margin:0}
.module dl div{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:3px 0}
.module dt{font-size:12px;color:var(--muted)}
.module dd{margin:0;font:600 13px var(--numbers)}
.chart-panel{margin-top:10px;padding:13px 15px 10px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.chart-head h3,.pie-panel h3{font-size:13px;margin:0}
.chart-head .segment{border:0;border-radius:0;padding:0}
.chart-head .segment button{border-radius:0;border-bottom:2px solid transparent}
.chart-head .segment button[aria-pressed=true]{background:transparent;border-bottom-color:#bd9556;color:#956d35}
.plot{position:relative}
.plot canvas{display:block;width:100%;height:194px}
.plot[data-compact=true] canvas{height:175px}
.plot-tip{position:absolute;display:none;pointer-events:none;z-index:2;background:#fff;border:1px solid #e1e7ef;border-radius:6px;box-shadow:0 4px 18px #1f365a19;padding:8px 10px;font-size:12px;white-space:nowrap}
.plot-tip b{display:block;margin-bottom:3px}
.legend{display:flex;gap:6px 13px;justify-content:center;flex-wrap:wrap;margin:2px 0 0}
.legend button{background:transparent;border:0;padding:0 2px;color:var(--muted);font-size:11px}
.legend button[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.swatch{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:5px}
.filter-panel{padding:10px 0;border-bottom:1px solid var(--line)}
.filter-panel .filters + .filters{margin-top:8px}
.filter-label{font-size:12px;color:var(--muted);white-space:nowrap}
.filter-btn{min-width:152px;text-align:left;display:flex;justify-content:space-between;gap:12px}
.filter-btn span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:175px}
.filter-btn span:last-child{color:var(--subtle)}
.filter-dropdown{position:relative}
.filter-dropdown summary{list-style:none;cursor:pointer;background:white;border:1px solid #dbe1e9;border-radius:5px;padding:7px 12px}
.filter-dropdown summary::-webkit-details-marker{display:none}
.filter-dropdown[open] summary,.filter-dropdown summary:hover{border-color:#a9bff6}
.dropdown-options{position:absolute;z-index:4;top:calc(100% + 4px);left:0;width:215px;padding:8px;background:white;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #1f365a19}
.dropdown-options input[type=search]{width:100%}
.dropdown-options label{display:flex;align-items:center;gap:7px;padding:5px 4px;cursor:pointer;border-radius:4px}
.dropdown-options label[hidden],.dropdown-options p[hidden]{display:none}
.dropdown-options label:hover{background:#f4f7fc}
.dropdown-options p{margin:6px 4px;color:var(--muted)}
@media(max-width:640px){.filter-panel{position:relative}.filter-dropdown{position:static}.dropdown-options{top:auto;left:0;margin-top:4px}}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.primary:hover{background:#194fce;color:white;border-color:#194fce}
.dimension{padding:0 14px}
.dimension .chart-panel{border:0;border-radius:0;margin:0;padding:10px 0}
.dimension-tabs{display:flex;gap:16px;border-bottom:1px solid var(--line)}
.dimension-tabs button{padding:9px 9px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted)}
.dimension-tabs button[aria-pressed=true]{border-color:var(--blue);color:var(--blue);font-weight:700}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid #edf0f4}
th{background:#f6f8fb;color:#516079;font-weight:600;font-size:12px}
td.num,th.num{text-align:right}
td.num{font:13px var(--numbers);font-variant-numeric:tabular-nums}
tbody tr:hover{background:#f8faff}
tbody tr:last-child td{border-bottom:0}
.table-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;color:var(--muted);font-size:12px}
.table-footer button{padding:4px 9px;margin-left:4px}
button:disabled{opacity:.45;cursor:default}
.empty{text-align:center;color:var(--muted);padding:20px}
.pies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pie-panel{padding:13px 15px}
.pie-body{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,45px);min-height:188px}
.pie{width:144px;aspect-ratio:1;flex:0 0 144px;position:relative}
.pie svg{display:block;width:100%;height:100%;overflow:visible}
.pie-slice{cursor:pointer;transition:opacity .15s,stroke-width .15s;pointer-events:stroke}
.pie-body[data-active] .pie-slice:not(.active){opacity:.25}
.pie-slice.active{stroke-width:25}
.pie-core{position:absolute;inset:23%;background:white;border-radius:50%;display:grid;place-content:center;text-align:center;font:600 20px var(--numbers);white-space:nowrap}
.pie-core{pointer-events:none}
.pie-core small{font:11px "Microsoft YaHei",sans-serif;color:var(--muted);margin-top:3px}
.pie-key{min-width:130px}
.pie-key button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 6px;font-size:12px;border:0;text-align:left}
.pie-key button.active{background:#edf3ff;color:#173e9b}
.pie-key b{font:600 12px var(--numbers)}
.pie-detail{min-height:24px;margin:0;text-align:center;color:var(--muted);font-size:12px}
.pie-detail:not(:empty){color:var(--ink)}
.rank{font:600 13px var(--numbers);color:var(--muted)}
.rank.hot{color:#9b6c2d;background:#fbf0dc;border-radius:4px;display:inline-block;min-width:24px;padding:2px;text-align:center}
.rank-share{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.rank-share progress{width:clamp(56px,8vw,110px);height:6px;border:0;border-radius:5px;overflow:hidden;background:#e9eef6;appearance:none}
.rank-share progress::-webkit-progress-bar{background:#e9eef6}
.rank-share progress::-webkit-progress-value{background:var(--blue);border-radius:5px}
.rank-share progress::-moz-progress-bar{background:var(--blue);border-radius:5px}
.rank-share span{min-width:6ch}
#token-ranking .table-footer{padding-inline:12px;border-top:1px solid var(--line)}
dialog{border:1px solid #dce3ec;border-radius:9px;padding:0;width:min(650px,calc(100% - 30px));color:var(--ink);box-shadow:0 18px 65px #14213d30}
dialog::backdrop{background:#19283c63}
.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line)}
.dialog-head h2{margin:0;font-size:16px}
.dialog-foot{justify-content:flex-end;gap:8px;border-top:1px solid var(--line);border-bottom:0}
.dialog-body{padding:13px 18px;max-height:65vh;overflow:auto}
.dialog-body p{color:var(--muted);margin:0 0 8px}
.picker-field{display:grid;grid-template-columns:70px 1fr;align-items:start;gap:8px;margin-bottom:10px}
.picker-field>label{padding-top:7px}
.picker-box{position:relative;max-width:360px}
.picker-input{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 6px;border:1px solid #dbe1e9;border-radius:5px;cursor:text}
.picker-input:focus-within{border-color:#be9b60;box-shadow:0 0 0 1px #e8d8bc}
.picker-box input[type=search]{flex:1 1 110px;min-width:0;padding:4px;border:0;outline:none}
.choices{position:absolute;z-index:3;top:calc(100% + 4px);left:0;right:0;max-height:185px;overflow:auto;background:white;border:1px solid var(--line);border-radius:5px;box-shadow:0 5px 14px #1f365a20;padding:3px 0}
.picker-toggle{padding:0 5px;border:0;background:transparent;color:var(--muted)}
.choices button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 9px;border:0;border-radius:0;text-align:left}
.choices button:hover,.choices button:focus-visible{background:#f4f7fc}
.choices button[aria-pressed=true]{color:var(--blue);background:#edf3ff}
.choices .empty{display:block;padding:8px}
#picker-body{min-height:min(275px,55vh)}
input[type=checkbox]{accent-color:var(--blue)}
.chips{display:contents}
.chips button{padding:2px 6px;background:#f4f6fb;font-size:11px}
#notice{margin:0;color:#a43d36}
@media(max-width:1250px){.grid7{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){:root{--rail:157px}.top,.tabs{padding-inline:15px}main{padding-inline:14px}.grid4,.grid7{grid-template-columns:repeat(2,minmax(0,1fr))}.pie-body{flex-wrap:wrap;gap:9px;padding:12px 0}.pie-key{width:100%}}
@media(max-width:640px){.rail{position:static;width:auto;display:flex;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:0 8px;flex-wrap:wrap}.brand{border:0;padding:0 5px;height:42px;font-size:13px}.rail-label,.tabs{display:none}.nav-link{padding:0 5px;margin:0 2px;font-size:12px}.shell{margin:0}.top{min-height:40px}.pies{grid-template-columns:1fr}.pie-key{width:auto}.stat-value{font-size:22px}.toolbar .push{margin-left:0}.picker-field{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="rail">
  <div class="brand"><b>CMS</b><i aria-hidden="true">m</i><span>招商证券</span></div>
  <nav aria-label="管理后台导航">
    <div class="rail-label" id="rail-buddy"><span aria-hidden="true">▤</span> Buddy 开放中心 <span aria-hidden="true">⌃</span></div>
    <ul class="rail-subnav" aria-labelledby="rail-buddy">
      <li><a class="nav-link" data-page="validation" href="#validation"><span aria-hidden="true">▣</span>外网模型事前检测记录</a></li>
    </ul>
    <div class="rail-label" id="rail-dashboard"><span aria-hidden="true">▤</span> 数据大屏 <span aria-hidden="true">⌃</span></div>
    <ul class="rail-subnav" aria-labelledby="rail-dashboard">
      <li><a class="nav-link" data-page="overview" href="#overview"><span aria-hidden="true">▦</span>全局总览</a></li>
      <li><a class="nav-link" data-page="token" href="#token"><span aria-hidden="true">▥</span>Token 消耗统计</a></li>
    </ul>
  </nav>
</aside>
<div class="shell">
  <header class="top"><div class="crumb"><span id="crumb-group">数据大屏</span><i>/</i><strong id="crumb">全局总览</strong></div><span class="demo">模拟数据</span></header>
  <nav class="tabs" aria-label="页面切换"><a data-page="overview" href="#overview">全局总览</a><a data-page="token" href="#token">Token 消耗统计</a><a data-page="validation" href="#validation">外网模型事前检测记录</a></nav>
  <main id="main"></main>
</div>
<dialog id="validation-export-dialog" aria-labelledby="validation-export-title" style="max-width:480px">
  <form id="validation-export-form">
    <header class="dialog-head"><h2 id="validation-export-title">导出时间范围</h2><button type="button" data-export-cancel aria-label="关闭">×</button></header>
    <div class="dialog-body" style="display:grid;gap:16px;padding:24px 18px">
      <label style="display:grid;gap:8px">开始时间<input name="start" type="datetime-local" required></label>
      <label style="display:grid;gap:8px">结束时间<input name="end" type="datetime-local" required></label>
      <p id="validation-export-error" role="alert" style="color:#cf3948;margin:0" hidden></p>
    </div>
    <footer class="dialog-foot"><button type="button" data-export-cancel>取消</button><button class="primary" type="submit">确认</button></footer>
  </form>
</dialog>
<dialog id="picker" aria-labelledby="picker-title">
  <form id="picker-form">
    <header class="dialog-head"><h2 id="picker-title"></h2><button type="button" data-close aria-label="关闭">×</button></header>
    <div class="dialog-body" id="picker-body"></div>
    <footer class="dialog-foot"><button type="button" data-clear>清空</button><button type="button" data-close>取消</button><button class="primary" type="submit">确认</button></footer>
  </form>
</dialog>
<script>
"use strict";
const main = document.querySelector("#main");
const picker = document.querySelector("#picker");
const colors = ["#2d65ed","#24a364","#d4892d","#794de0","#4390f5","#27a4a6","#a45ab4"];
const symbols = ["♙","∿","▥","ϟ","◉","◔","↗","♙","▤"];
const spaceNames = ["小招 Buddy","营销 AI 助理","财管 AI 助理","风控 AI 报表"];
const modelNames = ["deepseekv4","qw3.1","deepseek-r1","qwen3-max","glm-5"];
const departments = ["数字金融部","财富管理部","机构业务部","风险管理部","信息技术部","运营管理部"];
const groups = ["系统","运营","投顾","风控"];
const people = ["林子涵","陈知远","周明宇","李思宁","张亦航","王雨桐","赵景然","吴书瑶","徐泽宇","孙婉清","何嘉言","许文昊","高若曦","梁启明","沈安琪","蒋子墨","罗致远","郑嘉宁","叶明哲","唐雨菲","顾星辰","程宇轩","方思源","夏清越","陆文静","彭子恒","秦映雪","潘景行"].map((name,index) => ({
  name, department: departments[index % departments.length], group: groups[(index + Math.floor(index / 5)) % groups.length]
}));
const moduleNames = ["问答","专栏引流","会话辅助","Buddy 智能任务"];
const day = 86400000;
const endDay = Date.UTC(2026,10,12);
const startDay = Date.UTC(2026,4,1);
const iso = value => new Date(value).toISOString().slice(0,10);
const stamp = value => new Date(value).toISOString().slice(0,16);
const parseDay = value => Date.parse(value + "T00:00Z");
const number = value => Math.round(value).toLocaleString("zh-CN");
const decimal = (value, digits=2) => Number(value.toFixed(digits)).toLocaleString("zh-CN",{maximumFractionDigits:digits});
const compact = value => value >= 1e8 ? [decimal(value/1e8),"亿"] : value >= 1e4 ? [decimal(value/1e4),"万"] : [number(value),""];
const short = value => compact(value).join("");
const pct = value => decimal(value) + "%";
const safe = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
function randomGenerator(seed) {
  return () => {
    seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}
const random = randomGenerator(62317);
const records = [];
for (let date = startDay; date <= endDay; date += day) {
  const weekend = [0,6].includes(new Date(date).getUTCDay());
  const growth = 0.62 + (date-startDay)/(endDay-startDay)*0.62;
  const events = weekend ? 36 : 104;
  for (let index = 0; index < events; index++) {
    const user = Math.floor(random() ** 1.65 * people.length);
    const space = Math.floor(random() ** 1.7 * spaceNames.length);
    const model = Math.floor(random() ** 1.45 * modelNames.length);
    const module = Math.floor(random() ** .65 * moduleNames.length);
    const requests = Math.max(1,Math.round((2 + random()*14) * growth * (1 + (3-space)*.24)));
    const input = Math.round(requests * (1900 + random()*6300) * (1 + module*.12));
    const output = Math.round(requests * (300 + random()*2350));
    const successes = requests - (random() < .28 ? 1 : 0);
    const effective = Math.max(0,successes - (random() < .12 ? 1 : 0));
    const first = (370 + random()*650 + model*44) * successes;
    const answer = (1.75 + random()*3.1 + model*.25) * successes;
    const hour = 8 + Math.floor(random()*13);
    const minute = Math.floor(random()*12)*5;
    const channel = ["PC 端","移动端"][random() < .83 ? 0 : 1];
    records.push({time:date + hour*3600000 + minute*60000,user,space,model,module,requests,input,output,successes,effective,first,answer,channel});
  }
}

function add(stats,record) {
  for (const key of ["requests","input","output","successes","effective","first","answer"]) stats[key] += record[key];
  stats.users.add(record.user);
  stats.modules[record.module].add(record.user);
  stats.moduleTokens[record.module] += record.input+record.output;
}
function summarize(rows) {
  const stats = empty();
  for (const row of rows) add(stats,row);
  return stats;
}
function groupRows(rows,property,names) {
  const stats = names.map((name,index) => ({name,index,...empty()}));

}

function bucketStart(time,mode) {
  if (mode==="month") {
    const date = new Date(time);
    return Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),1);
  }
  const step = {five:300000,hour:3600000,day}[mode];
  return Math.floor(time/step)*step;
}
function bucketLabel(time,mode) {
  if (mode==="month") return iso(time).slice(0,7);
  if (mode==="day") return iso(time);
  return stamp(time).replace("T"," ");
}
function buckets(rows,from,to,mode) {
  const result = new Map();
  const step = {five:300000,hour:3600000,day}[mode];
  const effectiveStart = Math.max(from,startDay);
  const effectiveEnd = Math.min(to,endDay+day);
  if (effectiveStart>=effectiveEnd) return [];
  for (let time=bucketStart(effectiveStart,mode); time<effectiveEnd; time=step?time+step:Date.UTC(new Date(time).getUTCFullYear(),new Date(time).getUTCMonth()+1,1)) {
    result.set(time,{label:bucketLabel(time,mode),stats:empty()});
  }
  for (const row of rows) add(result.get(bucketStart(row.time,mode)).stats,row);
  return [...result.values()];
}
const charts = new Map();
function renderChart(id,labels,series,spec) {
  const canvas = document.getElementById(id);
  const legend = main.querySelector(`[data-legend="${id}"]`);
  const chart = {canvas,labels,series,spec,legend,hidden:new Set(),hover:null};
  charts.set(id,chart);
  legend.innerHTML = series.map((item,index)=>`<button data-legend-id="${id}" data-series="${index}" aria-pressed="true"><i class="swatch" style="background:${item.color}"></i>${safe(item.name)}</button>`).join("");
  canvas.addEventListener("pointermove",event=>{
    const {left,right} = chart.bounds;
    const x = event.offsetX;
    if (!labels.length || x<left || x>right) return hideTip(chart);
    chart.hover = Math.round((x-left)/(right-left)*(labels.length-1));
    const tip = canvas.nextElementSibling;
    tip.innerHTML = `<b>${safe(labels[chart.hover])}</b>` + series.map((item,index)=>{
      if (chart.hidden.has(index)) return "";
      const value = item.values[chart.hover];
      return `<div><i class="swatch" style="background:${item.color}"></i>${safe(item.name)} · ${value===null?"—":(spec.tipFormat||spec.format)(value)+((item.unit??spec.unit)==="%"?"%":(item.unit??spec.unit)?" "+(item.unit??spec.unit):"")}</div>`;
    }).join("");
    tip.style.display = "block";
    tip.style.left = Math.max(0,Math.min(canvas.clientWidth-tip.offsetWidth,x+10))+"px";
    tip.style.top = Math.max(0,Math.min(canvas.clientHeight-tip.offsetHeight,event.offsetY-32))+"px";
    paint(chart);
  });
  canvas.addEventListener("pointerleave",()=>hideTip(chart));
  paint(chart);
}
function hideTip(chart) {
  if (chart.hover===null) return;
  chart.hover = null;
  chart.canvas.nextElementSibling.style.display = "none";
  paint(chart);
}
function paint({canvas,labels,series,spec,hidden,hover}) {
  const chart = charts.get(canvas.id);
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  const scale = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(width*scale) || canvas.height !== Math.round(height*scale)) {
    canvas.width = Math.round(width*scale);
    canvas.height = Math.round(height*scale);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,width,height);
  const visible = series.filter((_,index)=>!hidden.has(index));
  const values = visible.flatMap(item=>item.values).filter(value=>value!==null);
  ctx.font = '11px "Segoe UI", sans-serif';
  if (!values.length) {
    ctx.fillStyle = "#78869b";
    ctx.textAlign = "center";
    ctx.fillText("暂无数据",width/2,height/2);
    chart.bounds = {left:40,right:width-10};
    return;
  }
  let observedMax = 0;
  for (const item of visible.filter(item=>item.axis!=="right")) for (const value of item.values) observedMax = Math.max(observedMax,value??0);
  const power = 10**Math.floor(Math.log10(Math.max(1,observedMax)/4));
  const tick = [1,2,2.5,5,10].map(value=>value*power).find(value=>value*4>=observedMax) || 1;
  const max = spec.max || tick*4;
  const tickLabel = value => spec.format(value)+(spec.unit==="%"?"%":"");
  const left = Math.max(34,ctx.measureText(tickLabel(max)).width+14);
  const rightValues = visible.filter(item=>item.axis==="right").flatMap(item=>item.values).filter(value=>value!==null);
  const rightMax = Math.max(4,Math.ceil(Math.max(0,...rightValues)/4)*4);
  const right = width-(spec.dualAxis?Math.max(46,ctx.measureText(number(rightMax)).width+18):13);
  const top = spec.dualAxis?25:12;
  const bottom = height-28;
  chart.bounds = {left,right};
  const x = index => labels.length<=1?(left+right)/2:left + (right-left)*index/(labels.length-1);
  const y = value => bottom - (bottom-top)*value/max;
  for (let index=0; index<=4; index++) {
    const value = max*index/4;
    const pos = y(value);
    ctx.beginPath();
    ctx.setLineDash(index?[4,4]:[]);
    ctx.strokeStyle = "#e1e7ef";
    ctx.lineWidth = 1;
    ctx.moveTo(left,pos);
    ctx.lineTo(right,pos);
    ctx.stroke();
    ctx.fillStyle = "#7c899d";
    ctx.textAlign = "right";
    ctx.fillText(tickLabel(value),left-7,pos+4);
  }
  if (spec.dualAxis) {
    ctx.textAlign = "left";
    for (let index=0;index<=4;index++) ctx.fillText(number(rightMax*index/4),right+7,y(max*index/4)+4);
    ctx.fillStyle = colors[0];
    ctx.textAlign = "left";
    ctx.fillText("交互量（次）",left,12);
    ctx.fillStyle = colors[1];
    ctx.textAlign = "right";
    ctx.fillText("活跃用户（人）",right,12);
  }
  ctx.setLineDash([]);
  const axisLabel = index => {
    const label = labels[index];
    const text = label.length>10 ? label.slice(5) : label;
    const half = ctx.measureText(text).width/2;
    const center = Math.max(half+2,Math.min(width-half-2,x(index)));
    return {text,center,start:center-half,end:center+half};
  };
  if (labels.length) {
    const first = axisLabel(0);
    const last = axisLabel(labels.length-1);
    const gap = 12;
    ctx.textAlign = "center";
    ctx.fillText(first.text,first.center,bottom+17);
    if (last.start>=first.end+gap) {
      const slots = Math.max(1,Math.floor((right-left)/(Math.max(first.end-first.start,last.end-last.start)+gap)));
      const stride = Math.ceil((labels.length-1)/slots);
      let previousEnd = first.end;
      for (let index=stride; index<labels.length-1; index+=stride) {
        const label = axisLabel(index);
        if (label.start<previousEnd+gap || label.end+gap>last.start) continue;
        ctx.fillText(label.text,label.center,bottom+17);
        previousEnd = label.end;
      }
      ctx.fillText(last.text,last.center,bottom+17);
    }
  }
  for (const item of visible) {
    const seriesY = value => item.axis==="right"?bottom-(bottom-top)*value/rightMax:y(value);
    ctx.strokeStyle = item.color;
    ctx.fillStyle = item.color;
    ctx.lineWidth = 1.9;
    ctx.lineJoin = "round";
    ctx.beginPath();
    let last = null;
    item.values.forEach((value,index)=>{
      if (value===null) {
        last = null;
        return;
      }
      const pos = x(index);
      if (last===null) ctx.moveTo(pos,seriesY(value));
      else if (item.values.length<=90) {
        const middle = (last.x+pos)/2;
        ctx.bezierCurveTo(middle,last.y,middle,seriesY(value),pos,seriesY(value));
      } else ctx.lineTo(pos,seriesY(value));
      last = {x:pos,y:seriesY(value)};
    });
    ctx.stroke();
    item.values.forEach((value,index)=>{
      if (value===null) return;
      const isolated = (item.values[index-1]??null)===null && (item.values[index+1]??null)===null;
      if (item.values.length>7 && !isolated) return;
      ctx.beginPath();
      ctx.arc(x(index),seriesY(value),2.5,0,Math.PI*2);
      ctx.fill();
    });
  }
  if (hover!==null) {
    ctx.beginPath();
    ctx.setLineDash([3,3]);
    ctx.strokeStyle = "#a2afc2";
    ctx.lineWidth = 1;
    ctx.moveTo(x(hover),top);
    ctx.lineTo(x(hover),bottom);
    ctx.stroke();
  }
}

  }).join("");

  document.querySelector("#crumb-group").textContent = page==="validation"?"Buddy 开放中心":"数据大屏";
  document.querySelector("#crumb").textContent = name;
  document.querySelectorAll("[data-page]").forEach(link=>{
    if (link.dataset.page===page) link.setAttribute("aria-current","page");
    else link.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
  render();
}
function exportOverview() {
  const from = parseDay(overview.start);
  const to = parseDay(overview.end)+day;
  const rows = filterOverview(from,to);
  const totals = overviewStats(rows,to);
  const daily = buckets(rows,from,to,"day");
  downloadCsv([
    ["日期范围",overview.start,overview.end],
    ["渠道",overview.channel||"全部渠道"],
    ["部门",overview.department||"全部部门"],
    ["数据来源","模拟数据"],
    [],
    ["指标","数值","单位"],
    ...overviewLabels.map((label,index)=>[label,totals[index]??"",overviewUnits[index]|| (index===8?"Token":"")]),
    [],
    ["日期","去重活跃用户数","全局功能总交互量","AI 整体服务有效率（%）","Token 消耗总量"],
    ...daily.map(({label,stats})=>[label,stats.users.size,stats.requests,stats.requests?(stats.effective/stats.requests*100).toFixed(2):"",stats.input+stats.output])
  ],`全局总览_${overview.start}_${overview.end}.csv`);
}
function downloadCsv(rows,filename) {
  const csv = rows.map(row=>row.map(cell=>'"'+String(cell).replaceAll('"','""')+'"').join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
main.addEventListener("click",event=>{
  const part = event.target.closest("[data-pie-part]");
  if (part) {
    const panel = part.closest(".pie-panel");
    const index = part.dataset.piePart;
    if (panel.dataset.selectedPart===index) delete panel.dataset.selectedPart;
    else panel.dataset.selectedPart = index;
    for (const legend of panel.querySelectorAll("button[data-pie-part]")) {
      legend.setAttribute("aria-pressed",String(legend.dataset.piePart===panel.dataset.selectedPart));
    }
    highlightPie(panel,panel.dataset.selectedPart);
    return;
  }
  const button = event.target.closest("button");
  if (!button) return;
  if (button.hasAttribute("data-validation-bulk-export")) {
    exportForm.reset();
    exportError.hidden=true;
    exportDialog.showModal();
    return;
  }
  if (button.hasAttribute("data-validation-reset")) {
    validation.filters = {...emptyValidationFilters};
    validation.page = 1;
    renderValidation();
    main.querySelector("[data-validation-reset]").focus({preventScroll:true});
    return;
  }
  if (button.dataset.validationPage) {
    validation.page = Number(button.dataset.validationPage);
    renderValidationResults();
    main.querySelector('[data-validation-page][aria-current="page"]').focus({preventScroll:true});
    return;
  }
  if (button.dataset.validationExport!==undefined) {
    const record = validationRecords[Number(button.dataset.validationExport)];
    downloadCsv([validationColumns,validationValues(record)],`外网模型事前检测记录_${record.id+1}.csv`);
    return;
  }
  const {preset,chartMode,mode,legendId,series,dimension,tablePage,rankPage,picker:filter} = button.dataset;
  if (preset) {
    const state = page==="token"?token:overview;
    state.preset = preset;
    if (preset!=="自定义") presetDates(state,preset);
    if (state===token) {
      token.page = 1;
      refreshTokenFilters();
    } else render();
    main.querySelector(`[data-preset="${preset}"]`)?.focus({preventScroll:true});
  } else if (chartMode) {
    overview.modes[chartMode] = mode;
    render();
    main.querySelector(`[data-chart-mode="${chartMode}"][data-mode="${mode}"]`)?.focus({preventScroll:true});
  } else if (legendId) {
    const chart = charts.get(legendId);
    const index = Number(series);
    if (chart.hidden.has(index)) chart.hidden.delete(index);
    else chart.hidden.add(index);
    button.setAttribute("aria-pressed",String(!chart.hidden.has(index)));
    paint(chart);
  } else if (dimension) {
    token.dimension = dimension;
    token.page = 1;
    for (const tab of main.querySelectorAll("[data-dimension]")) {
      tab.setAttribute("aria-pressed",String(tab===button));
    }
    refreshTokenFilters();
  } else if (tablePage) {
    token.page += Number(tablePage);
    renderTokenResults();
    const control = main.querySelector(`[data-table-page="${tablePage}"]:enabled`) || main.querySelector("[data-table-page]:enabled");
    control?.focus({preventScroll:true});
  } else if (rankPage) {
    token.rankPage += Number(rankPage);
    const rankingPanel = main.querySelector("#token-ranking");
    rankingPanel.innerHTML = ranking(tokenUsers,tokenTotal);
    rankingPanel.querySelector("[data-rank-page]:enabled")?.focus({preventScroll:true});
  } else if (filter==="user") openUserPicker();
  else if (button.hasAttribute("data-export")) exportOverview();
  else if (button.hasAttribute("data-reset")) {
    Object.assign(token,{preset:"近30日",granularity:"day",page:1});
    presetDates(token,token.preset);
    token[token.dimension].clear();
    if (token.dimension==="user") token.group.clear();
    refreshTokenFilters();
    main.querySelector("[data-reset]")?.focus({preventScroll:true});
  }
});
main.addEventListener("change",event=>{
  const input = event.target;
  if (input.matches("[data-dropdown-option]")) {
    const dropdown = input.closest("[data-dropdown]");
    const type = dropdown.dataset.dropdown;
    const index = Number(input.value);
    if (input.checked) token[type].add(index);
    else token[type].delete(index);
    const summary = dropdown.querySelector("summary");
    const label = dropdownLabel(type);
    summary.firstElementChild.textContent = label;
    summary.setAttribute("aria-label",dimensions[type]+"筛选，"+label);
    token.page = 1;
    renderTokenResults();
  } else if (input.matches("[data-start],[data-end]")) {
    const start = main.querySelector("[data-start]").value;
    const end = main.querySelector("[data-end]").value;
    const notice = main.querySelector("#notice");
    if (!start || !end || start>end) {
      notice.textContent = "请选择有效的开始和结束时间";
      return;
    }
    const state = page==="token"?token:overview;
    Object.assign(state,{start,end,preset:"自定义"});
    if (state===token) {
      notice.textContent = "";
      token.page = 1;
      renderTokenResults();
    } else render();
  } else if (input.dataset.overviewFilter) {
    overview[input.dataset.overviewFilter] = input.value;
    render();
    main.querySelector(`[data-overview-filter="${input.dataset.overviewFilter}"]`)?.focus({preventScroll:true});
  } else if (input.dataset.tokenSelect) {
    token[input.dataset.tokenSelect] = input.value;
    renderTokenResults();
    if (input.dataset.tokenSelect==="metric") main.querySelector('[data-token-select="metric"]')?.focus({preventScroll:true});
  }
});
main.addEventListener("input",event=>{
  const input = event.target;
  if (!input.matches("[data-dropdown-search]")) return;
  const dropdown = input.closest("[data-dropdown]");
  const query = input.value.trim().toLowerCase();
  const options = [...dropdown.querySelectorAll("[data-option]")];
  for (const option of options) option.hidden = !option.textContent.toLowerCase().includes(query);
  dropdown.querySelector("[data-no-options]").hidden = options.some(option=>!option.hidden);
});
document.addEventListener("click",event=>{
  for (const dropdown of main.querySelectorAll("[data-dropdown][open]")) {
    if (!dropdown.contains(event.target)) dropdown.open = false;
  }
});
main.addEventListener("keydown",event=>{
  if (event.key!=="Escape") return;
  const dropdown = event.target.closest("[data-dropdown][open]");
  if (!dropdown) return;
  dropdown.open = false;
  dropdown.querySelector("summary").focus();
});
main.addEventListener("toggle",event=>{
  const dropdown = event.target;
  if (dropdown.matches("[data-dropdown][open]")) dropdown.querySelector("[data-dropdown-search]").focus({preventScroll:true});
},true);
window.addEventListener("hashchange",navigate);
window.addEventListener("resize",()=>{ for (const chart of charts.values()) paint(chart); });
navigate();
</script>
</body>
